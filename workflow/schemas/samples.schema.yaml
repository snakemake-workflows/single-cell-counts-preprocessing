$schema: "https://json-schema.org/draft/2020-12/schema"
description: entries for the sample sheet
properties:
  sample_id:
    type: string
    description: sample identifier
  pool_id:
    type: string
    description: pool identifier, where a pool is a pool of samples for example sequenced with 10X single-cell RNAseq
  raw_counts_path:
    type: string
    description: Relative path to a per-sample count matrix with raw counts. This can be results from cellranger, for example as generated by the cellranger-multi Snakemake workflow, or an mtx file from kallisto bustools or alevin-fry. In the case of an MTX directory from cellranger, please provide the full path to the directory including the  'raw_feature_bc_matrix/'.
  format:
    type: string
    description: "Format of the input data given in column raw_counts_path. Choose a format that scanpy can read, so any suffix in one of the `scanpy.read_` functions. See https://scanpy.scverse.org/en/stable/api/io.html or double-check the code at: https://github.com/scverse/scanpy/blob/a656a33b080a5c1f64b01e841daad76f35f5ec5f/src/scanpy/io/_read.py#L44-L61"

required:
  - sample_id
  - raw_counts_path
  - format
